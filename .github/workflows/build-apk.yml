name: Build Android APK

on:
  push:
    branches:
      - test/build-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore missing Gradle wrapper files
        working-directory: android
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > local.properties
          gradle wrapper --gradle-version 8.10.2 --distribution-type all

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Patch legacy flutter_pcm_player namespace for this build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          cache = Path.home() / ".pub-cache/hosted/pub.dev"
          matches = list(cache.glob("flutter_pcm_player-*/android/build.gradle"))
          if not matches:
              raise SystemExit("flutter_pcm_player Android Gradle file not found")
          gradle_file = matches[-1]
          source = gradle_file.read_text()
          if re.search(r"namespace\\s*=", source):
              print("Namespace already defined; no patch needed.")
              raise SystemExit(0)
          manifest = gradle_file.parent / "src/main/AndroidManifest.xml"
          xml = manifest.read_text() if manifest.exists() else ""
          match = re.search(r'package=["\\']([^"\\']+)["\\']', xml)
          namespace = match.group(1) if match else "com.example.flutter_pcm_player"
          if not re.search(r"android\\s*\\{", source):
              raise SystemExit("Could not locate android { block in plugin Gradle file")
          source = re.sub(r"(android\\s*\\{)", r'\\1\\n    namespace "' + namespace + '"', source, count=1)
          gradle_file.write_text(source)
          print(f"Added temporary namespace {namespace} to {gradle_file}")
          PY

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-android-client-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
