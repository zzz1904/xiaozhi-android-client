name: Build Android APK

on:
  push:
    branches:
      - test/build-apk
      - feature/remove-dify-reference-dark-theme
  workflow_dispatch:

concurrency:
  group: xiaozhi-android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore missing Gradle wrapper files
        working-directory: android
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > local.properties
          gradle wrapper --gradle-version 8.10.2 --distribution-type all

      - name: Configure persistent Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Missing signing secrets. Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD in repository Actions secrets."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks
          cat > android/key.properties <<EOF
          storeFile=app/release-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Patch legacy flutter_pcm_player namespace for this build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          cache = Path.home() / ".pub-cache/hosted/pub.dev"
          matches = list(cache.glob("flutter_pcm_player-*/android/build.gradle"))
          if not matches:
              raise SystemExit("flutter_pcm_player Android Gradle file not found")
          gradle_file = matches[-1]
          source = gradle_file.read_text()
          if "namespace" in source:
              print("Namespace already defined; no patch needed.")
              raise SystemExit(0)
          manifest = gradle_file.parent / "src/main/AndroidManifest.xml"
          namespace = "com.example.flutter_pcm_player"
          if manifest.exists():
              try:
                  namespace = ET.parse(manifest).getroot().attrib.get("package", namespace)
              except ET.ParseError:
                  pass
          marker = "android {"
          position = source.find(marker)
          if position < 0:
              raise SystemExit("Could not locate android { block in plugin Gradle file")
          position += len(marker)
          source = source[:position] + '\n    namespace "' + namespace + '"' + source[position:]
          gradle_file.write_text(source)
          print("Added temporary namespace " + namespace + " to " + str(gradle_file))
          PY

      - name: Disable R8 minification for this build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle.kts")
          source = path.read_text()
          source = source.replace("isMinifyEnabled = true", "isMinifyEnabled = false")
          source = source.replace("isShrinkResources = true", "isShrinkResources = false")
          path.write_text(source)
          print("Disabled release minification/resource shrinking in the runner workspace only.")
          PY

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-android-client-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
